train: emoji_reply
valid: emoji_reply
tokenizer_name_or_path: atomic_emoji
cache_dir: ${oc.env:HOME}/mdlm_data
# Phase 2 sequences are `[BOS] prompt_emoji [SEP] response_emoji [EOS]`.
# Override `data_file` with your local JSON/JSONL/CSV/TSV instruction set.
data_file: null
emoji_vocab_sources:
  - text2emoji
  - data_file
  - common
emoji_vocab_extra_files: []
emoji_vocab_cache: ${.cache_dir}/atomic_emoji_vocab.json
emoji_cache_version: v4
emoji_challenge_set_path: data/emoji_reply/curated_permutation.jsonl
emoji_include_challenge_in_train: false
emoji_challenge_repeat: 1
emoji_benchmark_file: data/emoji_reply/benchmark.jsonl
emoji_split_strategy: random
emoji_validation_size: 0.05
emoji_split_seed: 42
emoji_max_prompt_tokens: null
emoji_max_response_tokens: null
emoji_supervised_pad_tokens: 0
permutation_augment_prob: 0.6
permutation_augment_prompt: true
permutation_augment_response: true
wrap: False
streaming: False
