- mode=train
- data=emoji_reply
- data.cache_dir=/tmp/emoji_mdlm_data
- data.emoji_vocab_cache=/tmp/emoji_mdlm_data/atomic_emoji_vocab.json
- model=small
- model.length=64
- parameterization=subs
- backbone=dit
- trainer.accelerator=cuda
- trainer.devices=1
- trainer.precision=bf16-mixed
- trainer.max_steps=300
- trainer.val_check_interval=5
- trainer.limit_val_batches=2
- trainer.num_sanity_val_steps=0
- trainer.log_every_n_steps=5
- loader.global_batch_size=512
- loader.batch_size=512
- loader.eval_batch_size=512
- loader.num_workers=8
- loader.pin_memory=true
- training.ema=0.9999
- eval.compute_generative_perplexity=false
- wandb.project=emoji-model
- wandb.name=emoji_reply_atomic_h100_v3
- wandb.id=emoji_reply_atomic_h100_v3_1
- checkpointing.resume_from_ckpt=false
- callbacks.checkpoint_every_n_steps.every_n_train_steps=50
