- mode=train
- data=emoji_reply
- data.cache_dir=/tmp/emoji_mdlm_two_phase_smoke
- data.emoji_vocab_cache=/tmp/emoji_mdlm_two_phase_smoke/atomic_emoji_vocab.json
- model=small
- model.length=64
- parameterization=subs
- backbone=dit
- trainer.accelerator=cuda
- trainer.devices=1
- trainer.precision=bf16-mixed
- +trainer.check_val_every_n_epoch=null
- trainer.limit_val_batches=2
- trainer.num_sanity_val_steps=0
- trainer.log_every_n_steps=5
- loader.global_batch_size=128
- loader.batch_size=128
- loader.eval_batch_size=128
- loader.num_workers=8
- loader.pin_memory=true
- training.ema=0.9999
- eval.compute_generative_perplexity=false
- wandb.project=emoji-model
- data.data_file=outputs/emoji_two_phase_h100_smoke/semantic_pairs.jsonl
- trainer.max_steps=5
- trainer.val_check_interval=50
- wandb.name=emoji_phase1_semantic_h100
- wandb.id=emoji_phase1_semantic_h100_1
- checkpointing.resume_from_ckpt=false
- callbacks.checkpoint_every_n_steps.every_n_train_steps=50
