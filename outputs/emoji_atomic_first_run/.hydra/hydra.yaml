hydra:
  run:
    dir: outputs/emoji_atomic_first_run
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/emoji_atomic_first_run
    - hydra.mode=RUN
    task:
    - mode=train
    - data=emoji_reply
    - data.cache_dir=/tmp/emoji_mdlm_data
    - data.emoji_vocab_cache=/tmp/emoji_mdlm_data/atomic_emoji_vocab.json
    - model=tiny-emoji
    - model.length=32
    - parameterization=subs
    - backbone=dit
    - strategy=single_device
    - trainer.accelerator=cpu
    - trainer.devices=1
    - trainer.precision=32
    - trainer.max_steps=3
    - trainer.val_check_interval=3
    - trainer.limit_val_batches=2
    - trainer.num_sanity_val_steps=0
    - trainer.log_every_n_steps=1
    - loader.global_batch_size=8
    - loader.batch_size=8
    - loader.eval_batch_size=8
    - loader.num_workers=0
    - loader.pin_memory=false
    - training.ema=0.999
    - eval.compute_generative_perplexity=false
    - wandb.project=emoji-model
    - wandb.name=emoji_atomic_first_run
    - checkpointing.resume_from_ckpt=false
    - callbacks.checkpoint_every_n_steps.every_n_train_steps=3
  job:
    name: main
    chdir: true
    override_dirname: backbone=dit,callbacks.checkpoint_every_n_steps.every_n_train_steps=3,checkpointing.resume_from_ckpt=false,data.cache_dir=/tmp/emoji_mdlm_data,data.emoji_vocab_cache=/tmp/emoji_mdlm_data/atomic_emoji_vocab.json,data=emoji_reply,eval.compute_generative_perplexity=false,loader.batch_size=8,loader.eval_batch_size=8,loader.global_batch_size=8,loader.num_workers=0,loader.pin_memory=false,mode=train,model.length=32,model=tiny-emoji,parameterization=subs,strategy=single_device,trainer.accelerator=cpu,trainer.devices=1,trainer.limit_val_batches=2,trainer.log_every_n_steps=1,trainer.max_steps=3,trainer.num_sanity_val_steps=0,trainer.precision=32,trainer.val_check_interval=3,training.ema=0.999,wandb.name=emoji_atomic_first_run,wandb.project=emoji-model
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/ubuntu/EmojiModel
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/EmojiModel/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/EmojiModel/outputs/emoji_atomic_first_run
    choices:
      lr_scheduler: constant_warmup
      noise: loglinear
      strategy: single_device
      model: tiny-emoji
      data: emoji_reply
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
